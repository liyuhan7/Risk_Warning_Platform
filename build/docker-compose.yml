version: '3.8'
services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - kafka-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    networks:
      - kafka-net
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CREATE_TOPICS: "test:1:1,behavior_processing_tasks:3:1,indicator_calculation_tasks:3:1,risk_assessment_tasks:3:1,questionnaire_reminder_tasks:3:1,assessment_completed_events:3:1,notification_tasks:3:1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9050:8080"
    networks:
      - kafka-net
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
      - zookeeper

  # 添加本地postgres和redis进行测试
  postgres:
    image: postgres:13
    container_name: postgres-risk-warning
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=risk_warning_platform
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kafka-net

  redis:
    image: redis:6.2-alpine
    container_name: redis-risk-warning
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    volumes:
      - redis-data:/data
    networks:
      - kafka-net

  # 注册中心与配置中心（standalone + 内嵌 Derby 存储）
  nacos:
    image: nacos/nacos-server:v2.4.2
    container_name: nacos
    ports:
      # 只绑定回环地址，避免向局域网暴露无鉴权服务；9848 为客户端 gRPC 端口（8848+1000）
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=128m
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - kafka-net

  # BERT向量化服务
  # bert-service:
  #   build:
  #     context: ../risk-warning-knowledge/bert-service
  #     dockerfile: Dockerfile
  #   container_name: bert-service
  #   ports:
  #     - "8001:8001"
  #   environment:
  #     - PORT=8001
  #     - HOST=0.0.0.0
  #     - BERT_MODEL_NAME=bert-base-chinese
  #   volumes:
  #     # 持久化模型缓存，避免每次重启都下载
  #     - bert-model-cache:/root/.cache/huggingface
  #   networks:
  #     - kafka-net
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 120s  # 模型加载需要时间，给120秒启动期
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 4G
  #       reservations:
  #         memory: 2G

  # 微服务
  bert:
    build:
      context: ..
      dockerfile: risk-warning-bert/Dockerfile
    container_name: bert
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - BERT_MODEL_NAME=bert-base-chinese
    volumes:
      - bert-model-cache:/root/.cache/huggingface
    networks:
      - kafka-net
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    depends_on:
      - kafka
    restart: always

  gateway:
    build:
      context: ..
      dockerfile: risk-warning-gateway/Dockerfile
    container_name: gateway
    ports:
      - "8088:8088"
    networks:
      - kafka-net
    depends_on:
      - kafka
      - bert
    restart: always

  org:
    build:
      context: ..
      dockerfile: risk-warning-org/Dockerfile
    container_name: org
    networks:
      - kafka-net
    depends_on:
      - kafka
    restart: always

  processing:
    build:
      context: ..
      dockerfile: risk-warning-processing/Dockerfile
    container_name: processing
    networks:
      - kafka-net
    depends_on:
      - kafka
      - bert
    restart: always

  notification:
    build:
      context: ..
      dockerfile: risk-warning-notification/Dockerfile
    container_name: notification
    networks:
      - kafka-net
    depends_on:
      - kafka
    restart: always

  report:
    build:
      context: ..
      dockerfile: risk-warning-report/Dockerfile
    container_name: report
    networks:
      - kafka-net
    depends_on:
      - kafka
    restart: always

  knowledge:
    build:
      context: ..
      dockerfile: risk-warning-knowledge/Dockerfile
    container_name: knowledge
    networks:
      - kafka-net
    depends_on:
      - kafka
      - bert
    restart: always



  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - kafka-net

  minio:
    container_name: milvus-minio
    image: minio/minio:latest
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/docker_volume/minio
    command: minio server /docker_volume/minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - kafka-net

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.5
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - kafka-net

volumes:
  bert-model-cache:
    driver: local
  nacos-data:
    driver: local
  postgres-data:
    external: true
  redis-data:
    external: true
  etcd-data:
    driver: local
  minio-data:
    driver: local
  milvus-data:
    driver: local

networks:
  kafka-net:
    driver: bridge


