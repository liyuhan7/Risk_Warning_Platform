spring:
  # 数据库配置 (Postgres in Docker)
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/risk_warning_platform
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: none
    # 控制台只保留业务日志；SQL 排查时在本地临时开启，避免概览轮询淹没完成日志。
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Elasticsearch 配置 (ES in Docker，本地无认证)
  elasticsearch:
    uris: http://127.0.0.1:9200
    connection-timeout: 1s
    socket-timeout: 30s

  # Kafka 配置 (Kafka in Docker)
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    consumer:
      group-id: test-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.riskwarning.common.message
        spring.json.value.default.type: com.riskwarning.common.message.Message
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3

  # Redis 配置 (Redis in Docker，密码见 build/docker-compose.yml)
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
    username: default
    password: 123456

assessment:
  reliability:
    # enabled 由服务自身显式配置；未配置时采用框架默认值 false。
    namespace: ${ASSESSMENT_WORK_NAMESPACE:${spring.application.name}}
    poll-interval: ${ASSESSMENT_WORK_POLL_INTERVAL:2s}
    lease-duration: ${ASSESSMENT_WORK_LEASE_DURATION:15m}
    heartbeat-interval: ${ASSESSMENT_WORK_HEARTBEAT_INTERVAL:60s}
    default-max-attempts: ${ASSESSMENT_WORK_MAX_ATTEMPTS:3}
    retry-delay: ${ASSESSMENT_WORK_RETRY_DELAY:30s}
    worker-threads: ${ASSESSMENT_WORKER_THREADS:2}

logging:
  file:
    name: ${spring.application.name}/out/app.log
  level:
    # IDE 控制台只显示业务服务进度、可靠链模式和异常；结构化审计明细保留按需开启。
    root: WARN
    com.riskwarning.common.observability.AssessmentFlowLogger: WARN
    com.riskwarning.common.reliability: WARN
    com.riskwarning.common.reliability.ReliabilityModeReporter: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
