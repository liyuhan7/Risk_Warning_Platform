server:
  port: 8089

# Milvus向量数据库配置
milvus:
  host: localhost
  port: 19530
  database: default
  timeout: 30000

# 向量化配置
vectorization:
  dimension: 768  # BERT向量维度
  batch-size: 32  # 批量处理大小
  max-sequence-length: 512  # 最大序列长度
  mode: api  # 使用API方式（本地Python服务）
  similarity-threshold: 0.3  # 语义搜索相似度阈值（0-1），默认0.3
  
  api:
    local-api-url: http://localhost:8000/encode  # 本地Python服务地址

# Elasticsearch配置
spring:
  # 本地开发密钥统一放仓库根 .env（已 gitignore）；无该文件的环境自动跳过
  config:
    import: optional:file:.env[.properties]
  elasticsearch:
    # uris: http://172.29.7.168:30920 先使用本地ES测试
    uris: http://localhost:9200

# 大模型 Provider 配置
# 按 OpenAI 兼容的 /chat/completions 协议接入，更换供应商只需调整 base-url 与 model。
# 凭据必须由环境变量 LLM_API_KEY 提供，禁止写入本文件。
llm:
  enabled: ${LLM_ENABLED:false}
  base-url: ${LLM_BASE_URL:}
  model: ${LLM_MODEL:}
  api-key: ${LLM_API_KEY:}
  temperature: 0.0
  # 附加请求体字段（JSON 字符串）：携带供应商可选参数，如关闭思考模式
  # {"thinking":{"type":"disabled"}}；凭据类字段禁止放入
  extra-body: ${LLM_EXTRA_BODY:}
  connect-timeout-seconds: 30
  read-timeout-seconds: 60
  write-timeout-seconds: 30
  retry:
    max-attempts: 3
    initial-backoff-millis: 500
    backoff-multiplier: 2.0
    # 触发重试的 HTTP 状态码；403/400/401 等语义错误不重试，一次终止
    retryable-status-codes: 408, 429, 500, 502, 503, 504
