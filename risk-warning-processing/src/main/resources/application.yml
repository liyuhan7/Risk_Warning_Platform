server:
  port: 8084

assessment:
  reliability:
    enabled: ${ASSESSMENT_RELIABILITY_ENABLED:true}

spring:
  config:
    import: optional:file:.env[.properties]

# BERT 分类服务配置
bert:
  service:
    url: http://localhost:8090  # BERT 服务地址（Java 服务端口）

# Knowledge 向量化服务配置
knowledge:
  service:
    url: http://localhost:8089  # Knowledge 服务地址

analysis:
  processing:
    batch-size: 16

feign:
  client:
    config:
      retrieval-service:
        connectTimeout: 3000
        readTimeout: 390000
        loggerLevel: basic

# 合规分析与事实抽取使用 OpenAI 兼容模型接口，凭据由本地配置或环境变量提供。
llm:
  enabled: ${LLM_ENABLED:true}
  base-url: ${LLM_BASE_URL:}
  model: ${LLM_MODEL:}
  extra-body: ${LLM_EXTRA_BODY:}
  api-key: ${LLM_API_KEY:}

logging:
  level:
    com.riskwarning.processing: INFO
