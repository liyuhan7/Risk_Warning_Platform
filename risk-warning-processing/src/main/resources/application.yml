server:
  port: 8084

assessment:
  reliability:
    enabled: ${ASSESSMENT_RELIABILITY_ENABLED:true}

spring:
  config:
    import: optional:file:.env[.properties]

# BERT 分类服务配置
bert:
  service:
    url: http://localhost:8090  # BERT 服务地址（Java 服务端口）

# Knowledge 向量化服务配置
knowledge:
  service:
    url: http://localhost:8089  # Knowledge 服务地址

analysis:
  rules:
    v2-enabled: ${SCORING_V2_ENABLED:false}
    v2-location: ${SCORING_V2_REGISTRY:classpath:rules/verified-rules-v2.json}
    allow-test-registry: ${SCORING_ALLOW_TEST_REGISTRY:false}
    evaluation-index: ${SCORING_EVALUATION_INDEX:t_requirement_evaluation}
    fact-mode: ${SCORING_FACT_MODE:INDICATOR}
    fact-catalog: ${SCORING_FACT_CATALOG:classpath:rules/labor-fact-bindings-v1.json}
    fact-max-questions: ${SCORING_FACT_MAX_QUESTIONS:16}
    fact-max-input-code-points: ${SCORING_FACT_MAX_INPUT_CODE_POINTS:12000}
    fact-concurrency: ${SCORING_FACT_CONCURRENCY:3}
  processing:
    batch-size: 16

feign:
  client:
    config:
      retrieval-service:
        connectTimeout: 3000
        readTimeout: 390000
        loggerLevel: basic

# 合规分析与事实抽取使用 OpenAI 兼容模型接口，凭据由本地配置或环境变量提供。
llm:
  enabled: ${LLM_ENABLED:true}
  base-url: ${LLM_BASE_URL:}
  model: ${LLM_MODEL:}
  extra-body: ${LLM_EXTRA_BODY:}
  api-key: ${LLM_API_KEY:}

logging:
  level:
    com.riskwarning.processing: INFO
