server:
  port: 8084

assessment:
  reliability:
    enabled: ${ASSESSMENT_RELIABILITY_ENABLED:true}

#初始化表后改为never
spring:
  config:
    import: optional:file:.env[.properties]

# BERT 分类服务配置
bert:
  service:
    url: http://localhost:8090  # BERT 服务地址（Java 服务端口）

# Knowledge 向量化服务配置
knowledge:
  service:
    url: http://localhost:8089  # Knowledge 服务地址

p2:
  mode: ${P2_PROCESSING_MODE:LEGACY}
  batch-size: 16

feign:
  client:
    config:
      retrieval-service:
        connectTimeout: 3000
        readTimeout: 390000
        loggerLevel: basic

# 大模型 Provider 配置由 Nacos risk-warning-processing.yml 提供（enabled/base-url/model/超时/重试）。
# 本文件只保留凭据占位符：api-key 由部署环境的环境变量 LLM_API_KEY 注入，禁止写入任何配置文件。
llm:
  api-key: ${LLM_API_KEY:}

logging:
  level:
    com.riskwarning.processing: INFO
